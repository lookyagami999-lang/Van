<!DOCTYPE html>
 <html lang="th">
 <head>
     <meta charset="UTF‑8">
     <meta name="viewport" content="width=device‑width, initial‑scale=1.0">
     <title>ระบบรับแจ้งปัญหา เทศบาลตำบลม่วงน้อย</title>
     <!-- Leaflet Map -->
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
     <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
     <!-- Firebase App + Firestore (ตัด Storage ออก) -->
     <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase‑app‑compat.js"></script>
     <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase‑firestore‑compat.js"></script>
     <style>
         #map{width:100%;height:420px !important;border‑radius:12px;margin:15px 0;}
         * {margin:0;padding:0;box‑sizing:border‑box;font‑family:'Sarabun',sans‑serif;}
         body {background:#f0f4f8;color:#333;}
         .header {background:linear‑gradient(135deg,#003366,#0056b3);color:white;padding:25px 20px;text‑align:center;}
         .container {max‑width:1200px;margin:30px auto;background:white;padding:30px;border‑radius:12px;box‑shadow:0 3px 15px rgba(0,0,0,0.08);}
         h2 {color:#003366;text‑align:center;margin‑bottom:25px;padding‑bottom:10px;border‑bottom:2px solid #d4af37;}
         .form‑group {margin‑bottom:18px;}
         label {display:block;margin‑bottom:6px;font‑weight:bold;color:#003366;}
         input,select,textarea {width:100%;padding:12px;border:1px solid #cbd5e0;border‑radius:8px;font‑size:16px;}
         textarea {resize:vertical;min‑height:120px;}
         button {background:linear‑gradient(135deg,#d4af37,#b8860b);color:white;border:none;padding:14px 24px;border‑radius:8px;cursor:pointer;width:100%;font‑size:18px;font‑weight:bold;margin‑top:10px;}
         .btn‑gps {background:#2563eb;width:auto;padding:10px 16px;font‑size:16px;}
         .pdpa‑text {font‑size:14px;color:#555;margin:8px 0;}
         .required {color:red;}
     </style>
 </head>
 <body>
     <div class="header">
         <h1>🏛️ เทศบาลตำบลม่วงน้อย</h1>
         <p>ระบบรับแจ้งปัญหา / ร้องเรียน</p>
     </div>
     <div class="container">
         <h2>🗺️ กดคลิกบนแผนที่ เพื่อปักหมุดตำแหน่งปัญหา</h2>
         <div id="map"></div>
         <div class="form‑group">
             <label>ชื่อ‑นามสกุล ผู้แจ้งเรื่อง <span class="required">*</span></label>
             <input type="text" id="reporterName" placeholder="กรุณากรอกชื่อ‑นามสกุล">
         </div>
         <div class="form‑group">
             <label>เบอร์โทรศัพท์ติดต่อ <span class="required">*</span></label>
             <input type="tel" id="reporterPhone" placeholder="กรุณากรอกเบอร์โทรศัพท์">
         </div>
         <div class="form‑group">
             <label>เลือกหมู่ที่ / พื้นที่ตำบลม่วงน้อย <span class="required">*</span></label>
             <select id="villageSelect">
                 <option value="">-- เลือกหมู่ที่ --</option>
                 <option value="หมู่ 1 ตำบลม่วงน้อย">หมู่ 1</option>
                 <option value="หมู่ 2 ตำบลม่วงน้อย">หมู่ 2</option>
                 <option value="หมู่ 3 ตำบลม่วงน้อย">หมู่ 3</option>
                 <option value="หมู่ 4 ตำบลม่วงน้อย">หมู่ 4</option>
                 <option value="หมู่ 5 ตำบลม่วงน้อย">หมู่ 5</option>
                 <option value="หมู่ 6 ตำบลม่วงน้อย">หมู่ 6</option>
                 <option value="หมู่ 7 ตำบลม่วงน้อย">หมู่ 7</option>
                 <option value="หมู่ 8 ตำบลม่วงน้อย">หมู่ 8</option>
             </select>
         </div>
         <div class="form‑group">
             <label>จุดเสาไฟฟ้า / จุดเกิดปัญหา <span class="required">*</span></label>
             <input type="text" id="pointProblem" placeholder="ตัวอย่าง : เสาไฟฟ้าหมู่ 3 หรือ จุดเกิดน้ำท่วม">
         </div>
         <div class="form‑group">
             <label>พิกัดที่ปักหมุด (ละติจูด / ลองจิจูด)</label>
             <input type="text" id="gpsLatLng" placeholder="กดคลิกแผนที่ หรือดึงตำแหน่ง GPS">
             <br>
             <button class="btn‑gps" onclick="getGPSLocation()">📍 ดึงตำแหน่งปัจจุบัน (GPS)</button>
         </div>
         <div class="form‑group">
             <label>ประเภทปัญหา <span class="required">*</span></label>
             <select id="problemType">
                 <option value="">-- เลือกประเภทปัญหา --</option>
                 <option value="กองช่าง (ถนนชำรุด)">กองช่าง (ถนนชำรุด)</option>
                 <option value="ไฟฟ้าส่องสว่าง">ไฟฟ้าส่องสว่าง</option>
                 <option value="สุขาภิบาลอาหาร">สุขาภิบาลอาหาร</option>
                 <option value="ขยะ">ขยะ</option>
                 <option value="น้ำท่วม">น้ำท่วม</option>
                 <option value="อื่น ๆ">อื่น ๆ</option>
             </select>
         </div>
         <div class="form‑group">
             <label>รายละเอียดปัญหา + สถานที่เพิ่มเติม <span class="required">*</span></label>
             <textarea id="problemDetail" placeholder="กรุณาเขียนรายละเอียดปัญหาและสถานที่เพิ่มเติม"></textarea>
         </div>
         <div class="form‑group">
             <label><input type="checkbox" id="pdpaCheck"> ยินยอมนโยบายคุ้มครองข้อมูลส่วนบุคคล PDPA <span class="required">*</span></label>
             <p class="pdpa‑text">ข้าพเจ้ายินยอมให้เทศบาลตำบลม่วงน้อย เก็บชื่อ เบอร์ พิกัด รายละเอียดปัญหา เพื่อดำเนินการแก้ไขปัญหาเท่านั้น</p>
         </div>
         <button onclick="submitComplaint()">✅ ส่งแจ้งปัญหา</button>
     </div>
 <script>
     // 🔴 แทนค่า Firebase Config ทั้ง 6 ค่า จาก Firebase Console
     const firebaseConfig = {
  apiKey: "AIzaSyAPqtEf2sBkS5mvCKhfJf_eUnoAsXWSKhs",
  authDomain: "muang-noy-complaint.firebaseapp.com",
  projectId: "muang-noy-complaint",
  storageBucket: "muang-noy-complaint.firebasestorage.app",
  messagingSenderId: "1027197347817",
  appId: "1:1027197347817:web:a888bcd324c194ab330d78",
  measurementId: "G-V8FK4T3KCM"
     };
     // ✅ ลำดับที่ถูกต้อง : เริ่มต้น Firebase ก่อน
     firebase.initializeApp(firebaseConfig);
     // ✅ ค่อยสร้าง db หลัง initializeApp เสร็จแล้ว
     const db = firebase.firestore();
     let map;
     let marker;
     const centerMuengNoi = {lat: 18.2100, lng: 99.0800};
     document.addEventListener('DOMContentLoaded', function() {
         try {
             if (typeof L === "undefined") {
                 alert("❌ โหลด Leaflet ไม่สำเร็จ 👉 ลองเปลี่ยนเบราว์เซอร์ หรือปิดตัวบล็อกโฆษณา");
                 return;
             }
             initLeafletMap();
         } catch (err) {
             alert("❌ ข้อผิดพลาดตอนโหลดหน้าเว็บ : " + err.message);
         }
     });
     function initLeafletMap(){
         try {
             map = L.map('map').setView([centerMuengNoi.lat, centerMuengNoi.lng], 14);
             L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution: '© OpenStreetMap'}).addTo(map);
             map.on('click', function(e){
                 const lat = e.latlng.lat;
                 const lng = e.latlng.lng;
                 if(marker) map.removeLayer(marker);
                 marker = L.marker([lat, lng]).addTo(map).bindPopup(`พิกัด : ${lat.toFixed(6)}, ${lng.toFixed(6)}`).openPopup();
                 document.getElementById("gpsLatLng").value = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
             });
         } catch (err) {
             alert("❌ สร้างแผนที่ล้มเหลว : " + err.message);
         }
     }
     function getGPSLocation(){
         if(!navigator.geolocation){
             alert("⚠️ เบราว์เซอร์ไม่รองรับ GPS ครับ สามารถคลิกแผนที่เพื่อปักจุดได้เลยครับ");
             return;
         }
         navigator.geolocation.getCurrentPosition(
             (position)=>{
                 const lat = position.coords.latitude;
                 const lng = position.coords.longitude;
                 if(marker) map.removeLayer(marker);
                 marker = L.marker([lat, lng]).addTo(map).bindPopup("ตำแหน่งปัจจุบัน").openPopup();
                 map.setView([lat, lng], 16);
                 document.getElementById("gpsLatLng").value = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
                 alert(`✅ ดึงพิกัดสำเร็จ!\nละติจูด : ${lat}\nลองจิจูด : ${lng}`);
             },
             (error)=>{
                 let errorMessage = "";
                 if(error.code === error.PERMISSION_DENIED){
                     errorMessage = "❌ ไม่สามารถดึงตำแหน่งได้ เนื่องจากปฏิเสธสิทธิ์ตำแหน่ง ✅ สามารถคลิกแผนที่เพื่อปักจุดได้เลยครับ";
                 }else{
                     errorMessage = `❌ ข้อผิดพลาด GPS : ${error.message}`;
                 }
                 alert(errorMessage);
             }
         )
     }
     async function submitComplaint(){
         try {
             const reporterName = document.getElementById("reporterName").value.trim();
             const reporterPhone = document.getElementById("reporterPhone").value.trim();
             const villageSelect = document.getElementById("villageSelect").value;
             const pointProblem = document.getElementById("pointProblem").value.trim();
             const problemType = document.getElementById("problemType").value;
             const problemDetail = document.getElementById("problemDetail").value.trim();
             const gpsLatLng = document.getElementById("gpsLatLng").value.trim();
             const pdpaCheck = document.getElementById("pdpaCheck").checked;
             if(!reporterName || !reporterPhone || !villageSelect || !pointProblem || !problemType || !problemDetail){
                 alert("⚠️ กรุณากรอกข้อมูลที่มีเครื่องหมาย * ให้ครบทุกช่องครับ");
                 return;
             }
             if(!pdpaCheck){
                 alert("⚠️ กรุณายอมรับนโยบายคุ้มครองข้อมูลส่วนบุคคล PDPA ก่อนส่งครับ");
                 return;
             }
             await db.collection("complaint_list").add({
                 reporterName: reporterName,
                 reporterPhone: reporterPhone,
                 village: villageSelect,
                 pointProblem: pointProblem,
                 problemType: problemType,
                 problemDetail: problemDetail,
                 gpsLatLng: gpsLatLng,
                 status: "รอรับเรื่อง",
                 submitTime: firebase.firestore.FieldValue.serverTimestamp()
             })
             alert("✅ ส่งแจ้งปัญหาสำเร็จครับ");
             document.getElementById("reporterName").value = "";
             document.getElementById("reporterPhone").value = "";
             document.getElementById("villageSelect").value = "";
             document.getElementById("pointProblem").value = "";
             document.getElementById("problemType").value = "";
             document.getElementById("problemDetail").value = "";
             document.getElementById("gpsLatLng").value = "";
             document.getElementById("pdpaCheck").checked = false;
             if(marker) map.removeLayer(marker);
         } catch (err) {
             alert("❌ ข้อผิดพลาดตอนส่งข้อมูลเข้า Firebase : " + err.message);
         }
     }
 </script>
 </body>
 </html>
